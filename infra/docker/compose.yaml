name: stormwatch
services:
  postgres:
    image: imresamu/postgis:17-3.6.1-bookworm
    environment:
      POSTGRES_DB: stormwatch
      POSTGRES_USER: stormwatch
      POSTGRES_PASSWORD: stormwatch
    ports: [ "127.0.0.1:5432:5432" ]
    volumes: [ pgdata:/var/lib/postgresql/data ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U stormwatch -d stormwatch" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy: { resources: { limits: { memory: 512m } } }

  redis:
    image: redis:8.8.4-alpine
    profiles: [ core ]
    ports: [ "127.0.0.1:6379:6379" ]
    deploy: { resources: { limits: { memory: 128m } } }

  kafka:
    image: apache/kafka:4.4.0
    profiles: [ events ]
    ports: [ "127.0.0.1:9092:9092" ]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    deploy: { resources: { limits: { memory: 1g } } }

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    profiles: [ auth ]
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports: [ "127.0.0.1:8180:8080" ]
    volumes: [ ../keycloak:/opt/keycloak/data/import ]
    deploy: { resources: { limits: { memory: 768m } } }

volumes:
  pgdata: { }
